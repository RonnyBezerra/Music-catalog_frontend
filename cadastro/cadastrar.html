<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar música - Minhas Músicas</title>
    <link rel="stylesheet" href="cadastrar.css">
</head>
<body>

    <main>
        <a href="index.html" class="voltar">Voltar para a lista</a>

        <h1>Cadastrar música</h1>

        <div class="campos">

            <div class="campo">
                <label for="titulo">Título</label>
                <input type="text" id="name" placeholder="Digite o título da música">
            </div>

            <div class="campo">
                <label for="artista">Artista</label>
                <input type="text" id="artist" placeholder="Digite o nome do artista">
            </div>

            <div class="campo">
                <label for="genero">Gênero</label>
                <input type="text" id="genre" placeholder="Digite o gênero musical">
            </div>

            <div class="campo">
                <label for="ano">Ano</label>
                <input type="number" id="year" placeholder="Digite o ano">
            </div>

            <div class="campo">
                <label for="duracao">Duração em minutos</label>
                <input type="number" id="duration" placeholder="Digite a duração">
            </div>

            <button id="botaoCadastrar">Cadastrar</button>

        </div>
    </main>

    <script src="cadastrar.js"></script>
</body>
</html>
